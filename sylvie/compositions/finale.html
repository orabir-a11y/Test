  <script>
    const tl = gsap.timeline({ paused: true });
    function burst(sel, tl, at, opts) {
      let s = opts.seed >>> 0;
      const rnd = () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      const colors = ["#FFC83D", "#FF4F5E", "#ffffff", "#36C5F0", "#7CDB6A", "#B86BFF"];
      const host = document.querySelector(sel);
      for (let i = 0; i < opts.count; i++) {
        const el = document.createElement("i");
        el.style.background = colors[i % colors.length];
        if (i % 4 === 0) { el.style.width = "22px"; el.style.height = "22px"; el.style.borderRadius = "50%"; }
        host.appendChild(el);
        const ang = rnd() * Math.PI * 2, pow = 260 + rnd() * 520;
        const x0 = opts.x, y0 = opts.y;
        const x1 = x0 + Math.cos(ang) * pow, y1 = y0 + Math.sin(ang) * pow * 0.7 - 120;
        const fall = opts.fall + rnd() * 500;
        const d = opts.dur * (0.75 + rnd() * 0.5);
        tl.fromTo(el, { x: x0, y: y0, rotation: 0, rotationX: 0, scale: 0.3, opacity: 1 },
          { x: x1, y: y1, rotation: rnd() * 540 - 270, scale: 1, duration: 0.45, ease: "power3.out" }, at);
        tl.to(el, { x: x1 + (rnd() - 0.5) * 220, y: y1 + fall, rotation: "+=" + (rnd() * 720 - 360), rotationX: rnd() * 720, duration: d, ease: "sine.in" }, at + 0.45);
      }
    }
    burst("#fn-confetti", tl, 0.15, { seed: 21, count: 60, x: 540, y: 700, fall: 1300, dur: 2.2 });
    tl.fromTo("#fn-shade", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0);
    tl.fromTo("#fn-kicker", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.15);
    tl.fromTo("#fn-name", { opacity: 0, scale: 0.3, rotation: -12 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.55, ease: "elastic.out(1, 0.5)" }, 0.25);

    // the altimeter flips: altitude becomes age
    tl.set("#fn-age", { opacity: 0 }, 0);
    tl.to("#fn-alt", { rotationX: 90, opacity: 0, duration: 0.18, ease: "power2.in", transformOrigin: "50% 50% -40px" }, 0.75);

    tl.fromTo("#fn-line2", { opacity: 0 }, { opacity: 0.9, duration: 0.3, ease: "power2.out" }, 0.95);
    window.__timelines["finale"] = tl;
