<!doctype html>
<html lang="he" dir="rtl"
  data-composition-variables='[{"id":"name","type":"string","label":"שם המטפלת","default":"גל יוסף"},{"id":"tagline","type":"string","label":"שורת מותג","default":"טיפולי פנים וקוסמטיקה מתקדמת"},{"id":"cta","type":"string","label":"קריאה לפעולה","default":"קבעי תור עכשיו"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
    @font-face { font-family: "Frank Ruhl Libre"; font-weight: 900; src: url("assets/fonts/frank-ruhl-libre-hebrew-900-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
    @font-face { font-family: "Frank Ruhl Libre"; font-weight: 900; src: url("assets/fonts/frank-ruhl-libre-latin-900-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
    @font-face { font-family: "Rubik"; font-weight: 400; src: url("assets/fonts/rubik-hebrew-400-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
    @font-face { font-family: "Rubik"; font-weight: 400; src: url("assets/fonts/rubik-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
    @font-face { font-family: "Rubik"; font-weight: 800; src: url("assets/fonts/rubik-hebrew-800-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
    @font-face { font-family: "Rubik"; font-weight: 800; src: url("assets/fonts/rubik-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
    :root { --ink: #141016; --ivory: #F8F3ED; --champagne: #E2BE82; --orchid: #B44BE0; --blush: #F4C9D2; }
    .t { position: absolute; left: 120px; right: 120px; text-align: center; direction: rtl; color: var(--ivory); font-family: "Rubik", sans-serif; font-weight: 800; line-height: 1.1; text-shadow: 0 4px 26px rgba(20,16,22,0.65), 0 2px 4px rgba(20,16,22,0.5); }
    .serif { font-family: "Frank Ruhl Libre", serif; font-weight: 900; }
    .w { display: inline-block; }
    .chip { display: inline-block; padding: 12px 36px 18px; border-radius: 999px; background: var(--ivory); color: var(--ink); text-shadow: none; box-shadow: 0 12px 36px rgba(20,16,22,0.35); }
    .chip-orchid { background: var(--orchid); color: #fff; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #cam { position: absolute; inset: 0; transform-origin: 50% 45%; }
      #cam video, #cam .still { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .layer { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="39.4" data-width="1080" data-height="1920">
      <!-- footage in slow motion, re-cut to the voice -->
      <div id="cam">
        <video id="v-hook" class="clip" src="assets/treatment.mp4" muted playsinline data-start="0" data-duration="6.0" data-media-start="13.6" data-playback-rate="0.6" data-track-index="0"></video>
        <video id="v-what" class="clip" src="assets/treatment.mp4" muted playsinline data-start="6.0" data-duration="6.75" data-media-start="0" data-playback-rate="0.65" data-track-index="0"></video>
        <video id="v-skin" class="clip" src="assets/treatment.mp4" muted playsinline data-start="12.75" data-duration="5.45" data-media-start="3.8" data-playback-rate="0.7" data-track-index="0"></video>
        <video id="v-close1" class="clip" src="assets/treatment.mp4" muted playsinline data-start="18.2" data-duration="2.4" data-media-start="7.8" data-playback-rate="0.7" data-track-index="0"></video>
        <video id="v-close2" class="clip" src="assets/treatment.mp4" muted playsinline data-start="20.6" data-duration="2.4" data-media-start="9.6" data-playback-rate="0.7" data-track-index="0"></video>
        <video id="v-close3" class="clip" src="assets/treatment.mp4" muted playsinline data-start="23.0" data-duration="2.4" data-media-start="11.3" data-playback-rate="0.7" data-track-index="0"></video>
        <video id="v-result" class="clip" src="assets/treatment.mp4" muted playsinline data-start="25.4" data-duration="6.6" data-media-start="13.9" data-playback-rate="0.7" data-track-index="0"></video>
        <img id="v-still" class="clip still" src="assets/last-frame.jpg" alt="" data-start="32.0" data-duration="7.4" data-track-index="0" />
      </div>

      <div id="hook" class="layer" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="6.0" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:3"></div>
      <div id="what" class="layer" data-composition-id="what" data-composition-src="compositions/what.html" data-start="6.0" data-duration="6.75" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:3"></div>
      <div id="skin" class="layer" data-composition-id="skin" data-composition-src="compositions/skin.html" data-start="12.75" data-duration="5.45" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:3"></div>
      <div id="benefits" class="layer" data-composition-id="benefits" data-composition-src="compositions/benefits.html" data-start="18.2" data-duration="7.2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:3"></div>
      <div id="result" class="layer" data-composition-id="result" data-composition-src="compositions/result.html" data-start="25.4" data-duration="6.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:3"></div>
      <div id="outro" class="layer" data-composition-id="outro" data-composition-src="compositions/outro.html" data-start="32.0" data-duration="7.4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:3"></div>

      <!-- voiceover: the clock of the film -->
      <audio id="vo-1" class="clip" src="assets/voice-gal-sts/t1.wav" data-start="0" data-duration="5.82" data-track-index="2" data-volume="0.75"></audio>
      <audio id="vo-2" class="clip" src="assets/voice-gal-sts/t2.wav" data-start="6.0" data-duration="6.57" data-track-index="2" data-volume="0.75"></audio>
      <audio id="vo-3" class="clip" src="assets/voice-gal-sts/t3.wav" data-start="12.75" data-duration="5.23" data-track-index="2" data-volume="0.75"></audio>
      <audio id="vo-4" class="clip" src="assets/voice-gal-sts/t4.wav" data-start="18.2" data-duration="6.98" data-track-index="2" data-volume="0.75"></audio>
      <audio id="vo-5" class="clip" src="assets/voice-gal-sts/t5.wav" data-start="25.4" data-duration="6.38" data-track-index="2" data-volume="0.75"></audio>
      <audio id="vo-6" class="clip" src="assets/voice-gal-sts/t6.wav" data-start="32.0" data-duration="5.58" data-track-index="2" data-volume="0.75"></audio>

      <!-- soft music bed under the voice -->
      <audio id="music" class="clip" src="assets/bgm/music-neutral.wav" data-start="0" data-duration="39.4" data-track-index="3" data-volume="0.13" data-fade-in="0.8" data-fade-out="2.5"></audio>

      <!-- sound effects -->
      <audio id="sfx-cut1" class="clip" src="assets/sfx/whoosh.mp3" data-start="5.87" data-duration="0.57" data-track-index="4" data-volume="0.4"></audio>
      <audio id="sfx-cut2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="12.62" data-duration="0.57" data-track-index="4" data-volume="0.4"></audio>
      <audio id="sfx-chip1" class="clip" src="assets/sfx/pop.mp3" data-start="19.29" data-duration="0.5" data-track-index="4" data-volume="0.35"></audio>
      <audio id="sfx-chip2" class="clip" src="assets/sfx/pop.mp3" data-start="20.79" data-duration="0.5" data-track-index="4" data-volume="0.35"></audio>
      <audio id="sfx-chip3" class="clip" src="assets/sfx/pop.mp3" data-start="22.5" data-duration="0.5" data-track-index="4" data-volume="0.35"></audio>
      <audio id="sfx-chip4" class="clip" src="assets/sfx/pop.mp3" data-start="23.75" data-duration="0.5" data-track-index="4" data-volume="0.35"></audio>
      <audio id="sfx-cut3" class="clip" src="assets/sfx/whoosh.mp3" data-start="25.27" data-duration="0.57" data-track-index="4" data-volume="0.4"></audio>
      <audio id="sfx-outro" class="clip" src="assets/sfx/sparkle.mp3" data-start="32.1" data-duration="1.8" data-track-index="4" data-volume="0.4"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // camera: slow pushes inside a shot, punch-ins on the cuts
      tl.fromTo("#cam", { scale: 1.12, x: 0, y: 0 }, { scale: 1.3, x: -30, duration: 6.0, ease: "none" }, 0);
      tl.set("#cam", { scale: 1.0, x: 0, y: 0 }, 6.0);
      tl.to("#cam", { scale: 1.12, duration: 6.75, ease: "sine.inOut" }, 6.0);
      tl.set("#cam", { scale: 1.15, x: 0, y: 0 }, 12.75);
      tl.to("#cam", { scale: 1.22, duration: 5.45, ease: "none" }, 12.75);
      tl.set("#cam", { scale: 1.3, x: 60, y: 40 }, 18.2);
      tl.to("#cam", { scale: 1.4, duration: 2.4, ease: "none" }, 18.2);
      tl.set("#cam", { scale: 1.45, x: -80, y: 60 }, 20.6);
      tl.to("#cam", { scale: 1.55, duration: 2.4, ease: "none" }, 20.6);
      tl.set("#cam", { scale: 1.2, x: 30, y: -20 }, 23.0);
      tl.to("#cam", { scale: 1.3, duration: 2.4, ease: "none" }, 23.0);
      tl.set("#cam", { scale: 1.3, x: -60, y: 0 }, 25.4);
      tl.to("#cam", { scale: 1.1, x: 0, duration: 6.6, ease: "power1.out" }, 25.4);
      tl.set("#cam", { scale: 1.1, x: 0, y: 0 }, 32.0);
      tl.to("#cam", { scale: 1.2, duration: 7.4, ease: "none" }, 32.0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
